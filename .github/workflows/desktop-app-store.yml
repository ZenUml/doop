name: Diagramly Mac App Store preparation

on:
  pull_request:
    paths:
      ['desktop/**', 'scripts/desktop-*', 'server/**', 'shared/**', 'src/**', '.github/workflows/desktop-app-store.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check native commerce policy and compile Swift bridge
        run: bash scripts/desktop-commerce-test.sh --webkit
      - name: Test Mac App Store profile (updater excluded)
        working-directory: desktop/src-tauri
        run: cargo test --locked --no-default-features --features app-store -- --test-threads=1
      - name: Test upstream shell compatibility
        working-directory: desktop/src-tauri
        run: cargo test --locked -- --test-threads=1
      - name: Check packaging scripts
        run: |
          bash -n scripts/desktop-app-store.sh scripts/desktop-commerce-test.sh
          node --check scripts/desktop-bundle-audit.mjs
          node --test scripts/desktop-bundle-audit.test.mjs
          node --test scripts/desktop-packaging.test.mjs

  unsigned-review-bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      DIAGRAMLY_BUILD_OUTPUT: ${{ runner.temp }}/zenuml-review-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build sandboxed review app and dependency inventory
        run: bash scripts/desktop-app-store.sh --unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagramly-mac-app-store-review
          path: ${{ runner.temp }}/zenuml-review-build/
          retention-days: 7
