<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { buildDiagramHtml } from '/shared/diagramFrame.ts'
      import { DiagramEditorWorkspace } from '/src/components/DiagramEditorWorkspace.tsx'
      import '/src/styles.css'

      const pages = Array.from({ length: 12 }, (_, index) => ({
        id: `page-${index + 1}`,
        title: `Scenario ${index + 1}`,
        kind: 'zenuml',
        source: `title Scenario ${index + 1}\nA->B: save`,
      }))
      const diagram = { ...pages[0], pages, activePageId: 'page-1' }
      const frame = {
        id: 'focused-layout',
        canvasId: 'canvas',
        pageId: 'board',
        name: 'Focused layout',
        x: 0,
        y: 0,
        width: 800,
        height: 600,
        createdAt: 1,
        updatedAt: 1,
        updatedBy: 'Browser test',
        html: buildDiagramHtml(diagram),
      }
      const shell = React.createElement(
        'div',
        { style: { height: '100dvh', paddingTop: '40px', '--app-inset': '40px' } },
        React.createElement('div', {
          'data-testid': 'desktop-tabs',
          style: { position: 'fixed', inset: '0 0 auto', height: '40px', zIndex: 50 },
        }),
        React.createElement(
          'div',
          {
            'data-canvas-page-root': true,
            style: {
              position: 'fixed',
              insetInline: 0,
              bottom: 0,
              top: 'var(--app-inset, 0px)',
            },
          },
          React.createElement(DiagramEditorWorkspace, {
            frame,
            diagram,
            canvasName: 'Local First Test',
            source: diagram.source,
            saving: false,
            unsaved: false,
            saveFailed: false,
            onChange: () => {},
            onSave: () => {},
            onRetry: () => {},
            onClose: () => {},
          }),
        ),
      )
      createRoot(document.getElementById('root')).render(shell)
    </script>
  </body>
</html>
